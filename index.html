<!DOCTYPE html>
<html>
    <head>
        <title>figure</title>
    </head>
    <style>
        
figure {
  border: 1px #cccccc solid;
  padding: 4px;
  margin: auto;
  width:500px;

  
}

figcaption {
  background-color: black;
  color: white;
  font-style: italic;
  padding: 2px;
  text-align: center;
  width:500px;
}
h1{
    text-align: center;
    text-decoration: underline;
    font-family: cursive;
    
}

    </style>
<body>

<h1>The figure and figcaption element</h1>

<figure>
  <img src="Trulli.jpg" alt="Trulli" style="width:100%">
  <figcaption>Fig.1 - Trulli, Puglia, Italy.</figcaption>
</figure>


</body>
</html>
